name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Check the agent contract
        run: |
          set -euo pipefail
          go build -o /tmp/rutter ./cmd/rutter
          spec="$(/tmp/rutter agent --json)"
          echo "$spec" | jq -e '.ok == true and (.data.commands | length) > 0'
          echo "$spec" | jq -e '[.data.commands[] | (.flags // [])[] | .name] | index("json") != null'
          set +e
          RUTTER_DATA_DIR="$(mktemp -d)" /tmp/rutter status --check --json >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 3

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate config files
        run: |
          set -euo pipefail
          for file in config/*.json; do
            jq -e . "$file" >/dev/null
          done
          test -f config/AGENTS.md
          find config/skills -name SKILL.md -print0 | xargs -0 -n1 sh -c 'grep -q "^description:" "$0"'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test in the official Go image
        run: docker run --rm -v "$PWD":/src -w /src golang:1.27.4 go test ./...
