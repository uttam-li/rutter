version: 2

project_name: rutter

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: rutter
    main: ./cmd/rutter
    binary: rutter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/uttam-li/rutter/internal/version.Version={{ .Version }}
      - -X github.com/uttam-li/rutter/internal/version.Commit={{ .Commit }}
      - -X github.com/uttam-li/rutter/internal/version.Date={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: linux-packages
    package_name: rutter
    vendor: Uttam Likhiya
    homepage: https://github.com/uttam-li/rutter
    maintainer: Uttam Likhiya <supercelluttam@gmail.com>
    description: Install and sync a shared OpenCode configuration.
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    dependencies:
      - git
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/rutter/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/rutter/README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
